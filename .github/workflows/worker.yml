name: Notification Worker Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/NotificationService/**'
      - 'src/Contracts/**'
      - 'tests/NotificationService.Tests/**'
      - '.github/workflows/worker.yml'
      - 'Infrastructure/Dockerfile.universal'

env:
  DOTNET_VERSION: '10.0.x'
  IMAGE_NAME: ghcr.io/${{ github.repository }}-worker
  PROJECT_NAME: NotificationService

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    name: Build, Test & Push Worker
    runs-on: ubuntu-latest

    services:
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Run Integration Tests
      env:
        RabbitMq__Host: localhost
        RabbitMq__Port: 5672
        RabbitMq__Username: guest
        RabbitMq__Password: guest
      run: |
        # Прогоняем тесты именно для воркера
        dotnet test tests/NotificationService.Tests/NotificationService.Tests.csproj \
          --configuration Release \
          --verbosity normal

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Lowercase Image Name
      shell: bash
      run: echo "IMAGE_NAME_LOWER=$(echo $IMAGE_NAME | tr '[:upper:]' '[:lower:]')" >> ${GITHUB_ENV}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Infrastructure/Dockerfile.universal
        build-args: |
          PROJECT_NAME=${{ env.PROJECT_NAME }}
          PROJECT_FILE=NotificationService.csproj
        push: true
        tags: |
          ${{ env.IMAGE_NAME_LOWER }}:latest
          ${{ env.IMAGE_NAME_LOWER }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max