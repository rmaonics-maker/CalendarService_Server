services:
  calendar-db:
    image: postgres:15
    container_name: ${CALENDAR_DB_HOST}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${CALENDAR_DB_NAME}
    ports:
      - "${CALENDAR_DB_PORT}:5432"
    networks:
      - calendar-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  notification-db:
    image: postgres:15
    container_name: notification-db-1
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
    ports:
      - "${NOTIFICATION_DB_PORT}:5432"
    networks:
      - calendar-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  auth-db:
    image: postgres:15
    container_name: auth-db-1
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    ports:
      - "${AUTH_DB_PORT}:5432"
    networks:
      - calendar-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  booking-db:
    image: postgres:15
    container_name: booking-db-1
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${BOOKING_DB_NAME}
    ports:
      - "${BOOKING_DB_PORT}:5432"
    networks:
      - calendar-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - calendar-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - calendar-net

  calendar-booking-api:
    build:
      context: ..
      dockerfile: src/Calendar.Booking.API/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    container_name: calendar-booking-api-1
    environment:
      ConnectionStrings__DefaultConnection: "Host=${BOOKING_DB_HOST};Port=5432;Database=${BOOKING_DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__Host: ${RABBIT_HOST}
      RabbitMq__Username: ${RABBIT_USER}
      RabbitMq__Password: ${RABBIT_PASS}
    depends_on:
      booking-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - calendar-net
    restart: on-failure
    ports:
      - "8082:8080"


  calendar-api:
    build:
      context: ..
      dockerfile: src/Calendar/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    container_name: calendar-api-1
    environment:
      ConnectionStrings__DefaultConnection: "Host=${CALENDAR_DB_HOST};Port=5432;Database=${CALENDAR_DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      RabbitMq__Host: ${RABBIT_HOST}
      RabbitMq__Username: ${RABBIT_USER}
      RabbitMq__Password: ${RABBIT_PASS}
      OTEL_EXPLORER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICENAME: "Calendar.Api"
      # Политики
      RetryPolicy__MaxRetries: ${RETRY_COUNT}
    depends_on:
      calendar-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - calendar-net
    secrets:
    - source: api_key_secret
      target: ExternalApi__ApiKey

  calendar-worker:
    build:
      context: ..
      dockerfile: src/NotificationService/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f dotnet || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    container_name: calendar-worker-1
    environment:
      RabbitMq__Host: ${RABBIT_HOST}
      RabbitMq__Username: ${RABBIT_USER}
      RabbitMq__Password: ${RABBIT_PASS}
      OTEL_EXPLORER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICENAME: "Calendar.Worker"
      ConnectionStrings__DefaultConnection: "Host=${NOTIFICATION_DB_HOST};Port=5432;Database=${NOTIFICATION_DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
    depends_on:
       rabbitmq:
          condition: service_healthy
       notification-db:
        condition: service_healthy
    networks:
      - calendar-net
    restart: on-failure

  calendar-auth-api:
    build:
      context: ..
      dockerfile: src/Calendar.Auth.API/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    container_name: calendar-auth-api-1
    environment:
      ConnectionStrings__DefaultConnection: "Host=${AUTH_DB_HOST};Port=5432;Database=${AUTH_DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      RabbitMq__Host: ${RABBIT_HOST}
      RabbitMq__Username: ${RABBIT_USER}
      RabbitMq__Password: ${RABBIT_PASS}
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - calendar-net
    restart: on-failure
    ports:
      - "8081:8081"

  jaeger:
    image: jaegertracing/all-in-one:latest
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 30s
      timeout: 10s
      retries: 3
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true 
    ports:
      - "16686:16686" 
      - "4317:4317"   
      - "4318:4318"   
    networks:
      - calendar-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - calendar-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - calendar-net

networks:
  calendar-net:
    driver: bridge

secrets:
  db_password_secret:
    file: ./secrets/db_password.txt
  api_key_secret:
    file: ./secrets/api_key.txt