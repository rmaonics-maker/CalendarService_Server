global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'calendar-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['calendar-api:8080']

  - job_name: 'booking-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['calendar-booking-api:8080']

  - job_name: 'auth-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['calendar-auth-api:8081']

  - job_name: 'notification-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['calendar-worker:8080']
