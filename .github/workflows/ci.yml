name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * *'
env:
  DOTNET_VERSION: '10.0.x'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/calendarservice-server

permissions:
  contents: read
  packages: write

jobs:
  # --- STAGE 0: UNIT TESTING ---
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Run Unit Tests
      run: |
        dotnet test tests/Calendar.UnitTests/Calendar.UnitTests.csproj --configuration Release
        dotnet test tests/Calendar.Auth.API.UnitTests/Calendar.Auth.API.UnitTests.csproj --configuration Release
        dotnet test tests/Booking.UnitTests/Booking.UnitTests.csproj --configuration Release

  # --- STAGE 1: INTEGRATION TESTING (DAY 4) ---
  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: integration_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: testuser
          RABBITMQ_DEFAULT_PASS: testpassword
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore & Build
      run: |
        dotnet restore
        dotnet build --no-restore --configuration Release

    - name: Run Integration Tests
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=integration_db;Username=testuser;Password=testpassword"
        ConnectionStrings__Redis: "localhost:6379"
        RabbitMq__Host: "localhost"
        RabbitMq__Port: "5672"
        RabbitMq__Username: "testuser"
        RabbitMq__Password: "testpassword"
      run: |
        dotnet test tests/Calendar.IntegrationTests/Calendar.IntegrationTests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=integration-test-results.trx"

  # --- STAGE 2: DELIVERY (DAY 5) ---
  build-and-push:
    name: Build & Push Docker Images
    needs: integration-tests 
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    strategy:
      matrix:
        include:
          - project_name: Calendar
            project_file: Calendar_Service.csproj
            image_suffix: server
          - project_name: Calendar.Auth.API
            project_file: Calendar.Auth.API.csproj
            image_suffix: auth-api
          - project_name: Calendar.Booking.API
            project_file: Calendar.Booking.API.csproj
            image_suffix: booking-api

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Infrastructure/Dockerfile.universal
        push: true
        build-args: |
          PROJECT_NAME=${{ matrix.project_name }}
          PROJECT_FILE=${{ matrix.project_file }}
        tags: |
          ghcr.io/${{ github.repository_owner }}/calendarservice-${{ matrix.image_suffix }}:latest
          ghcr.io/${{ github.repository_owner }}/calendarservice-${{ matrix.image_suffix }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max