services:
  calendar-db:
    image: postgres:15
    container_name: calendar-db-1
    environment:
      POSTGRES_USER: ${DB_USER}       # Берет из .env
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    networks:
      - calendar-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - calendar-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  calendar-api:
    build:
      context: .
      dockerfile: src/Calendar/Dockerfile

    container_name: calendar-api-1
    environment:
      ConnectionStrings__DefaultConnection: "Host=${DB_HOST};Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      
      # Настройки RabbitMQ для маппинга в C# класс
      RabbitMq__Host: ${RABBIT_HOST}
      RabbitMq__Username: ${RABBIT_USER}
      RabbitMq__Password: ${RABBIT_PASS}
      OTEL_EXPLORER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICENAME: "Calendar.Api"
      # Политики
      RetryPolicy__MaxRetries: ${RETRY_COUNT}
    depends_on:
      calendar-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - calendar-net

  calendar-worker:
    build:
      context: .
      dockerfile: tests/NotificationService/Dockerfile

    container_name: calendar-worker-1

    environment:
      RabbitMq__Host: ${RABBIT_HOST}
      RabbitMq__Username: ${RABBIT_USER}
      RabbitMq__Password: ${RABBIT_PASS}
      OTEL_EXPLORER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICENAME: "Calendar.Worker"
      
      ConnectionStrings__DefaultConnection: "Host=calendar-db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"

    depends_on:
       rabbitmq:
          condition: service_healthy
       calendar-db:
        condition: service_healthy

    networks:
      - calendar-net
    restart: on-failure

  jaeger:
    image: jaeger-tracing/all-in-one:latest
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true 
    ports:
      - "16686:16686" 
      - "4317:4317"   
      - "4318:4318"   
    networks:
      - calendar-net

networks:
  calendar-net:
    driver: bridge