services:
  calendar-db:
    image: postgres:15
    container_name: calendar-db-1
    environment:
      POSTGRES_USER: ${DB_USER}       # Берет из .env
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - calendar-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - calendar-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  calendar-api:
    build: .
    container_name: calendar-api-1
    environment:
      ConnectionStrings__DefaultConnection: "Host=${DB_HOST};Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      
      # Настройки RabbitMQ для маппинга в C# класс
      RabbitMq__Host: ${RABBIT_HOST}
      RabbitMq__Username: ${RABBIT_USER}
      RabbitMq__Password: ${RABBIT_PASS}
      
      # Политики
      RetryPolicy__MaxRetries: ${RETRY_COUNT}
    depends_on:
      calendar-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - calendar-net

networks:
  calendar-net:
    driver: bridge